name: Build and Deploy to Render

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  deploy-dev:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'dev'
    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Dev Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Production Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}"
